[package]
name = "csqtt-client"
version = "2.1.9"
edition = "2024"
rust-version = "1.97.1"
license = "PolyForm-Noncommercial-1.0.0"

[[bin]]
name = "client"
path = "main.rs"

[dependencies]
aes = "0.9.2"
anyhow = "1.0.104"
arc-swap = "1.9.2"
aws-lc-rs = "=1.18.0"
base64 = "0.23.0"
bytes = "1.12.1"
clap = { version = "4.6.4", default-features = false, features = ["derive", "std", "usage", "error-context"] }
crossbeam-queue = "0.3.13"
ctr = "0.10.1"
hex = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
crc32fast = "1.5.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
libc = "0.2.189"
md-5 = "0.11.0"
rand = { version = "0.10.2", features = ["sys_rng"] }
regex = { package = "regex-lite", version = "0.1.9" }
primp = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
socket2 = "0.6.5"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util", "io-std"] }
tokio-util = "0.7.19"
turn-rustls = { package = "primp-rustls", version = "=0.23.40", default-features = false, features = ["std", "tls12"] }
turn-tokio-rustls = { package = "primp-tokio-rustls", version = "=0.26.5" }
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4"] }
webpki-roots = "=1.0.9"
getrandom = "0.4"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["socket", "uio"] }

[dev-dependencies]
proptest = "1.11.0"
tokio = { version = "1.53.1", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
debug = false
incremental = false
overflow-checks = false

[patch.crates-io]
primp = { path = "vendor/primp" }
